name: Weekly Docs Backup

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  backup-docs:
    runs-on: ubuntu-latest

    steps:
      # 1. main 브랜치 체크아웃
      - uses: actions/checkout@v4
        with:
          ref: main

      # 2. docs-backup 브랜치 체크아웃 (파일 유지)
      - name: Checkout docs-backup
        run: |
          git fetch origin
          git checkout docs-backup || git checkout --orphan docs-backup

      # 3. 기존 docs ZIP 아카이브 (삭제 전에!)
      - name: Archive previous docs
        run: |
          if [ -d "docs" ]; then
            mkdir -p archives
            ZIP_NAME="archives/docs_$(date +'%Y-%m-%d').zip"
            zip -r "$ZIP_NAME" docs
          else
            echo "No previous docs to archive"
          fi

      # 4. 기존 docs 제거
      - name: Remove old docs
        run: |
          rm -rf docs

      # 5. 최신 docs 복사
      - name: Copy latest docs from main
        run: |
          git checkout main -- docs

      # 6. 커밋 & 푸시
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs archives
          git commit -m "Weekly docs backup + archive ($(date +'%Y-%m-%d'))" || echo "No changes"
          git push -f origin docs-backup
