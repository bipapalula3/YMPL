<!DOCTYPE html>
<html lang='ko'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <meta name='theme-color' content='#111217' />
  <title>YMPL omakase</title>
  <link href='https://fonts.googleapis.com/css2?family=Nanum+Barun+Gothic&display=swap' rel='stylesheet'>
  <style>
    html { background:#111217; }
    body {
      opacity: 1;
      transition: opacity 0.12s ease;
    }
    body.page-fade-out { opacity: 0; }
    body {
      background:#111217;
      color:#e6eef6;
      font-family:'Nanum Barun Gothic','Nanum Gothic','Malgun Gothic',Arial,sans-serif;
      font-size:16px;
      padding:16px;
      line-height:1.6;
      text-align:left;
      word-break:break-word;
      line-break:strict;
    }
    a { color:#93c5fd; text-decoration:none; }
    a:hover { text-decoration:underline; }
    h1 { font-size:22px; margin-top:60px; margin-bottom:16px; text-align:left; letter-spacing:-0.04em; }
    .artist-subtitle { font-size:18px; letter-spacing:-0.04em; }
    .album-entry { margin:8px 0 8px; }
    img {
      max-width:100%;
      height:auto;
      display:block;
      border-radius:12px;
      box-shadow:0 0 8px rgba(0,0,0,0.5);
      transition: transform 0.25s ease, filter 0.25s ease;
    }
    img:hover { transform: scale(1.03); filter: brightness(1.05); }
    .credit { font-size:12px; color:#aaaaaa; margin-top:4px; text-align:left; }
    .btn {
      display:inline-block;
      padding:10px 16px;
      background:#1f6feb;
      color:#fff;
      border-radius:10px;
      margin-top:10px;
      margin-right:20px;
      font-size:16px;
      text-align:center;
    }
    .artist-image-wrapper { margin: 24px 0; max-width: 750px; }
    .artist-img-box { position: relative; overflow: hidden; }
    .artist-img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,0.6); }
    .artist-credit-overlay { position:absolute; right:10px; bottom:8px; font-size:12px; color:#f3f4f6; padding:6px 10px; border-radius:8px; backdrop-filter:blur(4px); }
    .artist-link-overlay { position:absolute; left:12px; bottom:12px; display:flex; flex-direction:column-reverse; gap:10px; }
    .artist-btn { padding:12px 20px; font-size:15px; color:#fff; background:rgba(37,99,235,0.6); border:1px solid rgba(147,197,253,0.6); border-radius:14px; backdrop-filter:blur(6px); transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.2s ease; }
    .artist-btn:hover { background:rgba(29,78,216,0.8); transform:translateY(-2px); box-shadow:0 6px 16px rgba(30,64,175,0.6); }
/* =========================
   Index Page Artist Media
   ========================= */
.index-page .artist-image-wrapper {
  max-width: 420px;
  margin: 16px 0 8px 0;
}
.index-page .album-entry {
  margin-bottom: 48px;
}
.index-page .artist-img {
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
}
/* =========================
   Mobile Tap / Click Smooth
   ========================= */
.index-page a,
.index-page img {
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  tap-highlight-color: rgba(0,0,0,0);
}
.index-page a,
.index-page .artist-img {
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.index-page a:active,
.index-page .artist-img:active {
  transform: scale(0.97);
  opacity: 0.85;
}
.index-page a {
  touch-action: manipulation;
}
/* ===== Test Ad Card ===== */
.test-ad-card { margin:36px 0; padding:16px; border-radius:14px; background:#0f172a; border:1px dashed #334155; }
.test-ad-label { font-size:13px; color:#93c5fd; margin-bottom:6px; }
.test-ad-body { font-size:15px; color:#e5e7eb; }
  </style>
</head>
<body class='index-page'>
<h1>YMPL omakase</h1>
<div><div id='index-list'></div>
<div><div class='album-entry'><a class='btn' href='https://bipapalula3.github.io/YMPL/blog/YMPL_omakase/untitled/GOT_the_beat.html' target='_blank'>GOT the beat &nbsp;▶️ Album Link</a></div></div>
<div><div class='album-entry'><a class='btn' href='https://bipapalula3.github.io/YMPL/blog/YMPL_omakase/untitled/Kang_Seung_won.html' target='_blank'>Kang Seung won &nbsp;▶️ Album Link</a></div></div>
<div><div class='album-entry'><a class='btn' href='https://bipapalula3.github.io/YMPL/blog/YMPL_omakase/untitled/Kang_Sung_Hoon.html' target='_blank'>Kang Sung Hoon &nbsp;▶️ Album Link</a></div></div>
<div></div></div>

    <div class="test-ad-card">
      <div class="test-ad-label">🎧 Test Music Ad</div>
      <div class="test-ad-body">
        <strong>음악을 더 깊게 즐겨보세요</strong><br>
        스트리밍 · 헤드폰 · LP · 음악 잡지
      </div>
    </div>
    
<br><hr>
<p style="color:#fca5a5;">💿 Discover the album now</p>
</body>
</html>
